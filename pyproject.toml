[project]
name = "astrbot_plugin_winremote"
version = "0.7.0"
description = "Remote control Windows via QQ/AstrBot with WebSocket reverse tunnel, audit logging, and WebUI Pages"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.9"
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["tests/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (formatter handles it)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    # websockets >= 14 deprecated WebSocketServerProtocol; we use Protocol fallback
    "ignore::DeprecationWarning:websockets.*",
    # AsyncMock coroutines created but not awaited in _dispatch paths
    # (agent.send() returns awaitable; in some exception paths it's GC'd)
    "ignore::RuntimeWarning:coroutine.*never awaited",
]
