[project]
name = "astrbot-plugin-winremote"
version = "0.9.6"
description = "通过 QQ 远程控制 Windows 电脑（AstrBot 插件）"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.9"
dependencies = [
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I", "B"]
